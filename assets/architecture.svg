<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-label="IPsec Lite architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#090B18"/>
    </linearGradient>
    <linearGradient id="cyanviolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E2A48" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="450" fill="url(#bg)"/>
  <rect width="1280" height="450" fill="url(#grid)"/>
  <text x="640" y="42" text-anchor="middle" fill="#E8EEF8" font-family="Segoe UI, Inter, sans-serif" font-size="20" letter-spacing="6">ARCHITECTURE</text>
  <!-- nodes -->
  <g font-family="Segoe UI, Inter, sans-serif" text-anchor="middle">
    <g transform="translate(70,110)">
      <rect width="240" height="200" rx="16" fill="#0A0E1E" stroke="#00F0FF" stroke-width="2"/>
      <text x="120" y="86" fill="#00F0FF" font-size="13">01</text>
      <text x="120" y="130" fill="#E8EEF8" font-size="20">IPsec Lite</text>
      <text x="120" y="156" fill="#8B9BB4" font-size="13">App  ·  HUD  ·  Tray</text>
    </g>
    <g transform="translate(370,110)">
      <rect width="240" height="200" rx="16" fill="#0A0E1E" stroke="#A855F7" stroke-width="2"/>
      <text x="120" y="86" fill="#A855F7" font-size="13">02</text>
      <text x="120" y="130" fill="#E8EEF8" font-size="20">IKEv1 Engine</text>
      <text x="120" y="156" fill="#8B9BB4" font-size="13">XAuth  ·  2FA  ·  ESP</text>
    </g>
    <g transform="translate(670,110)">
      <rect width="240" height="200" rx="16" fill="#0A0E1E" stroke="#34F5C5" stroke-width="2"/>
      <text x="120" y="86" fill="#34F5C5" font-size="13">03</text>
      <text x="120" y="130" fill="#E8EEF8" font-size="20">Wintun</text>
      <text x="120" y="156" fill="#8B9BB4" font-size="13">Virtual adapter</text>
    </g>
    <g transform="translate(970,110)">
      <rect width="240" height="200" rx="16" fill="#0A0E1E" stroke="#E879F9" stroke-width="2"/>
      <text x="120" y="86" fill="#E879F9" font-size="13">04</text>
      <text x="120" y="130" fill="#E8EEF8" font-size="20">FortiGate</text>
      <text x="120" y="156" fill="#8B9BB4" font-size="13">Gateway</text>
    </g>
  </g>
  <!-- arrows -->
  <g fill="#00F0FF">
    <rect x="318" y="205" width="44" height="3" rx="1"/>
    <polygon points="370,206.5 352,198 352,215"/>
    <rect x="618" y="205" width="44" height="3" rx="1" fill="#A855F7"/>
    <polygon points="670,206.5 652,198 652,215" fill="#A855F7"/>
    <rect x="918" y="205" width="44" height="3" rx="1" fill="#34F5C5"/>
    <polygon points="970,206.5 952,198 952,215" fill="#34F5C5"/>
  </g>
  <rect x="70" y="360" width="1140" height="50" rx="10" fill="#0A0E1E" stroke="#00F0FF" stroke-opacity="0.5"/>
  <text x="640" y="391" text-anchor="middle" fill="#C4D0E6" font-family="ui-monospace, monospace" font-size="14">UDP 500  →  4500   ·   AES-CBC + HMAC   ·   Mode Config   ·   XAuth / 2FA   ·   Split routes + DNS</text>
