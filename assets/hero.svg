<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="IPsec Lite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#090B18"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6FFFF"/>
      <stop offset="100%" stop-color="#C8AAFF"/>
    </linearGradient>
    <radialGradient id="gc" cx="32%" cy="42%" r="45%"><stop offset="0%" stop-color="#00F0FF" stop-opacity="0.28"/><stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="gv" cx="72%" cy="38%" r="50%"><stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E3278" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#gc)"/>
  <rect width="1280" height="400" fill="url(#gv)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <line x1="80" y1="300" x2="1200" y2="300" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.25;0.8;0.25" dur="4s" repeatCount="indefinite"/>
  </line>
  <!-- brackets -->
  <path d="M28 70 V28 H70" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M1210 28 H1252 V70" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M28 330 V372 H70" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M1210 372 H1252 V330" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <!-- wordmark (system fonts; prefer the PNG in the README) -->
  <text x="640" y="175" text-anchor="middle" fill="url(#title)" font-family="Orbitron, Segoe UI, sans-serif" font-size="72" font-weight="700">IPsec Lite</text>
  <text x="640" y="230" text-anchor="middle" fill="#E8EEF8" font-family="Rajdhani, Segoe UI, sans-serif" font-size="24">FortiGate-compatible IPsec. Reimagined.</text>
</svg>
